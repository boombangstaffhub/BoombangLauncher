# Builds the Windows installer and publishes it as a GitHub Release
# every time "version" in package.json changes on main.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ASSETS=$(gh release view "v$VERSION" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$ASSETS" | grep -qx 'latest.yml' && echo "$ASSETS" | grep -qx 'BoomBang-Launcher-Setup.exe'; then
            echo "Release v$VERSION already published, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "Removing incomplete release v$VERSION"
              gh release delete "v$VERSION" --yes --cleanup-tag
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.v.outputs.skip == 'false'
        run: npm ci --no-audit --no-fund

      - name: Build installer
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Publish release
        if: steps.v.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          ls -la dist
          node -e "const {notesFor}=require('./updater');process.stdout.write(notesFor(require('fs').readFileSync('CHANGELOG.md','utf8'),'$VERSION')||'Versión $VERSION')" > notes.md
          gh release create "v$VERSION" --title "BoomBang Launcher $VERSION" --notes-file notes.md --target "$GITHUB_SHA" \
            "dist/BoomBang-Launcher-Setup.exe" "dist/BoomBang-Launcher-Setup.exe.blockmap" "dist/latest.yml"
