<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 189" width="436" height="189">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1d4f"/><stop offset="1" stop-color="#140f2b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9b8ff"/>
    </marker>
  </defs>
  <rect width="436" height="189" rx="16" fill="url(#bg)"/>

  <!-- ciclo -->
  <g transform="translate(218 96)">
    <circle r="54" fill="none" stroke="url(#ring)" stroke-width="3" opacity=".35"/>
    <path d="M -46 -28 A 54 54 0 0 1 46 -28" fill="none" stroke="#c9b8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#head)"/>
    <path d="M 52 14 A 54 54 0 0 1 -6 54" fill="none" stroke="#c9b8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#head)"/>
    <path d="M -26 47 A 54 54 0 0 1 -53 -10" fill="none" stroke="#c9b8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#head)"/>
    <!-- isla -->
    <ellipse cx="0" cy="16" rx="26" ry="7" fill="#3fb6c9"/>
    <path d="M -18 15 Q 0 -2 18 15 Z" fill="#e8c77a"/>
    <path d="M 0 12 Q 2 -6 -2 -16" fill="none" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/>
    <path d="M -2 -16 q -14 -2 -18 6 M -2 -16 q 12 -6 18 2 M -2 -16 q -4 -10 -14 -12 M -2 -16 q 6 -10 16 -8" fill="none" stroke="#3ec46d" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- etiquetas -->
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle" font-size="11">
    <rect x="148" y="8" width="140" height="24" rx="12" fill="#e5484d"/>
    <text x="218" y="24.5" fill="#fff" textLength="118" lengthAdjust="spacingAndGlyphs">Colgado → reenvía</text>

    <rect x="276" y="120" width="150" height="24" rx="12" fill="#ffb020"/>
    <text x="351" y="136.5" fill="#1a1230" textLength="130" lengthAdjust="spacingAndGlyphs">Sin respuesta → reinicia</text>

    <rect x="10" y="120" width="150" height="24" rx="12" fill="#36c275"/>
    <text x="85" y="136.5" fill="#0e2a19" textLength="130" lengthAdjust="spacingAndGlyphs">Sin conexión → a la isla</text>
  </g>
  <text x="218" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b7aee0" text-anchor="middle" textLength="220" lengthAdjust="spacingAndGlyphs">Todo automático: no tienes que hacer nada</text>
</svg>
